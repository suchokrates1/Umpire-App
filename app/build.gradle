plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

android {
    namespace = 'pl.vestmedia.tennisreferee'
    compileSdk 35

    // ── Versioning scheme ───────────────────────────────────────
    // versionCode = MAJOR*100000 + MINOR*10000 + PATCH*1000 + BUILD
    // versionName = "MAJOR.MINOR.PATCH-QUALIFIER.BUILD"
    //
    // Qualifiers (Play Store track):
    //   dev.N    → internal testing  (frequent builds)
    //   alpha.N  → alpha track       (tested features)
    //   beta.N   → open beta         (release candidates)
    //   (none)   → production        (public release)
    //
    // Flow: Upload to internal → promote to alpha → beta → production
    // ─────────────────────────────────────────────────────────────
    def vMajor = 1
    def vMinor = 0
    def vPatch = 0
    def vBuild = 1            // increment for each build
    def vQualifier = "dev"    // "dev" | "alpha" | "beta" | "" (production)

    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'blindtennis2026'
            keyAlias 'blindtennis'
            keyPassword 'blindtennis2026'
        }
    }

    defaultConfig {
        applicationId "pl.vestmedia.tennisreferee"
        minSdk 24
        targetSdk 35
        versionCode vMajor * 100000 + vMinor * 10000 + vPatch * 1000 + vBuild
        versionName vQualifier ? "${vMajor}.${vMinor}.${vPatch}-${vQualifier}.${vBuild}" : "${vMajor}.${vMinor}.${vPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    
    // Screenshot testing
    androidTestImplementation 'tools.fastlane:screengrab:2.1.1'
}
